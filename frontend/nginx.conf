server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy API requests to backend (pass full path including /cv-ats prefix)
    location /cv-ats/api/ {
        proxy_pass http://backend:8000/cv-ats/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django admin to backend (pass full path including /cv-ats prefix)
    location /cv-ats/admin/ {
        proxy_pass http://backend:8000/cv-ats/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django static files (admin CSS/JS) to backend
    location /cv-ats/static/ {
        proxy_pass http://backend:8000/cv-ats/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets
    location /cv-ats/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle SPA routing under /cv-ats - fallback to index.html
    location /cv-ats/ {
        try_files $uri $uri/ /cv-ats/index.html;
    }

    # Redirect /cv-ats to /cv-ats/
    location = /cv-ats {
        return 301 /cv-ats/;
    }

    # Disable caching for index.html
    location = /cv-ats/index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Default root redirect to /cv-ats/
    location / {
        return 301 /cv-ats/;
    }
}
